[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
preview = false
exclude = [".venv", "venv"]
force-exclude = true
fix = true
unsafe-fixes = true 

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
ignore = ["E501"]

[tool.pyright]​
include = [​"bad_code.py"]​
pythonVersion = "3.12"​
typeCheckingMode = "strict"​
venvPath = "."​
venv = ".venv"​