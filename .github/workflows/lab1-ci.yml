name: Lab 1 checks
on: [push, pull-request]
permissions:
contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_1

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Ruff lint
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .

      - name: Pyright
        run: uvx pyright

      - name: Tests
        run: uv run --with pytest pytest tests