default_install_hook_types:
  - pre-commit
  - pre-push

files: ^lab_1/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pyright
        name: pyright
        entry: python -m pyright --project lab_1 lab_1
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: python -m pytest lab_1/tests
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]