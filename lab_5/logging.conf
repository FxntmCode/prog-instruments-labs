[loggers]
keys=root

[handlers]
keys=console,file

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=console,file

[handler_console]
class=StreamHandler
level=NOTSET
formatter=simpleFormatter
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=NOTSET
formatter=simpleFormatter
args=('app.log', 'a', 1000000, 3, 'utf-8')

[formatter_simpleFormatter]
format=%(asctime)s | %(levelname)s | %(name)s | %(message)s